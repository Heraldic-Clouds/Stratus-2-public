# Reject oversized unauthenticated callback bodies before PHP JSON decoding.
<LocationMatch "^/(index[.]php/)?apps/stratus2_ai/photo-worker/">
    LimitRequestBody 8192
</LocationMatch>
<LocationMatch "^/(index[.]php/)?apps/stratus2_ai/photo-worker/[^/]+/complete$">
    LimitRequestBody 60000000
</LocationMatch>
