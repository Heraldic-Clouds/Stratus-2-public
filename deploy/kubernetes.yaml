apiVersion: v1
kind: Namespace
metadata:
  name: stratus2
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata: {name: postgres, namespace: stratus2}
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: local-path
  resources: {requests: {storage: 35Gi}}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata: {name: nextcloud, namespace: stratus2}
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: local-path
  resources: {requests: {storage: 30Gi}}
---
apiVersion: apps/v1
kind: StatefulSet
metadata: {name: postgres, namespace: stratus2}
spec:
  serviceName: postgres
  replicas: 1
  selector: {matchLabels: {app: postgres}}
  template:
    metadata: {labels: {app: postgres}}
    spec:
      automountServiceAccountToken: false
      securityContext: {fsGroup: 999}
      containers:
        - name: postgres
          image: postgres:17.6-bookworm
          envFrom: [{secretRef: {name: database}}]
          env: [{name: POSTGRES_DB, value: nextcloud}, {name: POSTGRES_USER, value: nextcloud}, {name: PGDATA, value: /var/lib/postgresql/data/pgdata}]
          ports: [{containerPort: 5432}]
          volumeMounts: [{name: data, mountPath: /var/lib/postgresql/data}]
          resources: {requests: {cpu: 250m, memory: 512Mi}, limits: {cpu: '2', memory: 3Gi}}
          readinessProbe: {exec: {command: [pg_isready, -U, nextcloud, -d, nextcloud]}, initialDelaySeconds: 10, periodSeconds: 10}
      volumes: [{name: data, persistentVolumeClaim: {claimName: postgres}}]
---
apiVersion: v1
kind: Service
metadata: {name: postgres, namespace: stratus2}
spec: {selector: {app: postgres}, ports: [{port: 5432}]}
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: redis, namespace: stratus2}
spec:
  replicas: 1
  selector: {matchLabels: {app: redis}}
  template:
    metadata: {labels: {app: redis}}
    spec:
      automountServiceAccountToken: false
      containers:
        - name: redis
          image: redis:7.4.5-bookworm
          command: [sh, -ec, 'exec redis-server --requirepass "$REDIS_PASSWORD" --maxmemory 256mb --maxmemory-policy noeviction --save "" --appendonly no']
          envFrom: [{secretRef: {name: redis}}]
          ports: [{containerPort: 6379}]
          resources: {requests: {cpu: 50m, memory: 128Mi}, limits: {cpu: '1', memory: 384Mi}}
          securityContext: {allowPrivilegeEscalation: false}
---
apiVersion: v1
kind: Service
metadata: {name: redis, namespace: stratus2}
spec: {selector: {app: redis}, ports: [{port: 6379}]}
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: nextcloud, namespace: stratus2}
spec:
  replicas: 1
  strategy: {type: Recreate}
  selector: {matchLabels: {app: nextcloud}}
  template:
    metadata: {labels: {app: nextcloud}}
    spec:
      automountServiceAccountToken: false
      imagePullSecrets: [{name: ecr}]
      containers:
        - name: nextcloud
          image: NEXTCLOUD_IMAGE
          envFrom: [{secretRef: {name: nextcloud}}, {configMapRef: {name: nextcloud}}]
          ports: [{containerPort: 80}]
          volumeMounts: [{name: html, mountPath: /var/www/html}]
          resources: {requests: {cpu: 500m, memory: 2Gi}, limits: {cpu: '3', memory: 7Gi}}
          startupProbe: {httpGet: {path: /status.php, port: 80}, failureThreshold: 120, periodSeconds: 10}
          readinessProbe: {httpGet: {path: /status.php, port: 80}, periodSeconds: 10}
          livenessProbe: {httpGet: {path: /status.php, port: 80}, initialDelaySeconds: 120, periodSeconds: 30, failureThreshold: 6}
        - name: cron
          image: NEXTCLOUD_IMAGE
          command: [/cron.sh]
          envFrom: [{secretRef: {name: nextcloud}}, {configMapRef: {name: nextcloud}}]
          volumeMounts: [{name: html, mountPath: /var/www/html}]
          resources: {requests: {cpu: 100m, memory: 256Mi}, limits: {cpu: '1', memory: 1Gi}}
      volumes: [{name: html, persistentVolumeClaim: {claimName: nextcloud}}]
---
apiVersion: v1
kind: Service
metadata: {name: nextcloud, namespace: stratus2}
spec:
  type: NodePort
  externalTrafficPolicy: Local
  selector: {app: nextcloud}
  ports: [{port: 80, targetPort: 80, nodePort: 30080}]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: private-databases, namespace: stratus2}
spec:
  podSelector: {matchExpressions: [{key: app, operator: In, values: [postgres, redis]}]}
  policyTypes: [Ingress, Egress]
  ingress:
    - from: [{podSelector: {matchLabels: {app: nextcloud}}}]
      ports: [{protocol: TCP, port: 5432}, {protocol: TCP, port: 6379}]
  egress: []
