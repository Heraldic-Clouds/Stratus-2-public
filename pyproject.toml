[project]
name = "stratus2"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "boto3==1.43.114",
  "openai==3.31.0",
  "Pillow==13.0.0",
  "opencv-python-headless==5.0.0.93",
  "ImageHash==4.3.2",
  "requests==2.34.2",
]

[project.optional-dependencies]
dev = ["pytest==9.1.1", "ruff==0.17.1", "PyYAML==6.0.3", "python-hcl2==8.1.4"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "S"]
ignore = ["S101"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S"]
"scripts/*" = ["S603", "S607"]
